openapi: 3.0.3

info:
  title: Avito Kitchen API
  version: 1.0.0
  description: |
    MVP API сервиса заказа еды «Авито.Кухня».

    Аутентификация в рамках тестового задания не реализуется.
    user_id передаётся клиентом при создании заказа.
    В production-системе user_id должен извлекаться из
    аутентифицированного контекста.

servers:
  - url: http://localhost:8080

tags:
  - name: System
  - name: User
  - name: Restaurant

paths:
  /healthz:
    get:
      tags:
        - System
      summary: Проверка состояния API
      operationId: health
      responses:
        "200":
          description: API работает
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    type: string
                    example: ok

  /api/v1/restaurants:
    get:
      tags:
        - User
      summary: Получить список активных ресторанов
      operationId: listRestaurants
      responses:
        "200":
          description: Список ресторанов
          content:
            application/json:
              schema:
                type: object
                required:
                  - restaurants
                properties:
                  restaurants:
                    type: array
                    items:
                      $ref: "#/components/schemas/Restaurant"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/restaurants/{restaurant_id}/menu-items:
    parameters:
      - $ref: "#/components/parameters/RestaurantID"

    get:
      tags:
        - User
      summary: Получить меню ресторана
      operationId: getRestaurantMenu
      responses:
        "200":
          description: Меню ресторана
          content:
            application/json:
              schema:
                type: object
                required:
                  - restaurant_id
                  - items
                properties:
                  restaurant_id:
                    type: integer
                    format: int64
                    example: 1
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/MenuItem"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

    post:
      tags:
        - Restaurant
      summary: Добавить позицию меню
      operationId: createMenuItem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMenuItemRequest"
      responses:
        "201":
          description: Позиция создана
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MenuItem"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/restaurants/{restaurant_id}/menu-items/{menu_item_id}:
    parameters:
      - $ref: "#/components/parameters/RestaurantID"
      - $ref: "#/components/parameters/MenuItemID"

    patch:
      tags:
        - Restaurant
      summary: Изменить позицию меню
      operationId: updateMenuItem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMenuItemRequest"
      responses:
        "200":
          description: Позиция обновлена
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MenuItem"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/orders:
    post:
      tags:
        - User
      summary: Создать заказ
      operationId: createOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderRequest"
      responses:
        "201":
          description: Заказ создан
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/orders/{order_id}:
    parameters:
      - $ref: "#/components/parameters/OrderID"

    get:
      tags:
        - User
      summary: Получить заказ
      operationId: getOrder
      responses:
        "200":
          description: Заказ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/restaurants/{restaurant_id}/orders:
    parameters:
      - $ref: "#/components/parameters/RestaurantID"

    get:
      tags:
        - Restaurant
      summary: Получить заказы ресторана
      description: |
        Используется cursor pagination.

        Заказы сортируются по created_at DESC, id DESC.
        Если next_cursor не равен null, его необходимо передать
        как cursor для получения следующей страницы.
      operationId: listRestaurantOrders
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/OrderStatus"
        - name: limit
          in: query
          required: false
          description: Размер страницы. По умолчанию 20, максимум 100.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: cursor
          in: query
          required: false
          description: Cursor, полученный из next_cursor предыдущего ответа.
          schema:
            type: string
      responses:
        "200":
          description: Страница заказов
          content:
            application/json:
              schema:
                type: object
                required:
                  - orders
                properties:
                  orders:
                    type: array
                    items:
                      $ref: "#/components/schemas/Order"
                  next_cursor:
                    type: string
                    nullable: true
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/restaurants/{restaurant_id}/orders/{order_id}:
    parameters:
      - $ref: "#/components/parameters/RestaurantID"
      - $ref: "#/components/parameters/OrderID"

    get:
      tags:
        - Restaurant
      summary: Получить заказ ресторана
      operationId: getRestaurantOrder
      responses:
        "200":
          description: Заказ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/restaurants/{restaurant_id}/orders/{order_id}/status:
    parameters:
      - $ref: "#/components/parameters/RestaurantID"
      - $ref: "#/components/parameters/OrderID"

    patch:
      tags:
        - Restaurant
      summary: Изменить статус заказа
      description: |
        Разрешённые переходы:

        CREATED -> ACCEPTED

        CREATED -> REJECTED

        ACCEPTED -> PREPARING

        PREPARING -> READY

        READY -> COMPLETED
      operationId: updateOrderStatus
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  $ref: "#/components/schemas/OrderStatus"
      responses:
        "200":
          description: Статус изменён
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

components:
  parameters:
    RestaurantID:
      name: restaurant_id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1

    MenuItemID:
      name: menu_item_id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1

    OrderID:
      name: order_id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1

  schemas:
    Restaurant:
      type: object
      required:
        - id
        - name
        - description
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: Demo Restaurant
        description:
          type: string
          example: Demo restaurant for Avito Kitchen

    MenuItem:
      type: object
      required:
        - id
        - restaurant_id
        - name
        - description
        - price
        - is_available
        - created_at
        - updated_at
      properties:
        id:
          type: integer
          format: int64
          example: 1
        restaurant_id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: Burger
        description:
          type: string
          example: Beef burger
        price:
          type: integer
          format: int64
          minimum: 0
          description: Цена в копейках.
          example: 50000
        is_available:
          type: boolean
          example: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateMenuItemRequest:
      type: object
      required:
        - name
        - price
      properties:
        name:
          type: string
          example: Burger
        description:
          type: string
          example: Beef burger
        price:
          type: integer
          format: int64
          minimum: 0
          description: Цена в копейках.
          example: 50000

    UpdateMenuItemRequest:
      type: object
      description: Должно быть передано хотя бы одно поле.
      properties:
        name:
          type: string
        description:
          type: string
        price:
          type: integer
          format: int64
          minimum: 0
          description: Цена в копейках.
        is_available:
          type: boolean

    CreateOrderRequest:
      type: object
      required:
        - user_id
        - restaurant_id
        - items
      properties:
        user_id:
          type: integer
          format: int64
          minimum: 1
          description: |
            Внешний идентификатор пользователя.
            Аутентификация не входит в MVP.
          example: 12345
        restaurant_id:
          type: integer
          format: int64
          minimum: 1
          example: 1
        items:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/CreateOrderItemRequest"

    CreateOrderItemRequest:
      type: object
      required:
        - menu_item_id
        - quantity
      properties:
        menu_item_id:
          type: integer
          format: int64
          minimum: 1
          example: 1
        quantity:
          type: integer
          minimum: 1
          example: 2

    OrderStatus:
      type: string
      enum:
        - CREATED
        - ACCEPTED
        - PREPARING
        - READY
        - COMPLETED
        - REJECTED

    Order:
      type: object
      required:
        - id
        - user_id
        - restaurant_id
        - status
        - total_price
        - items
        - created_at
        - updated_at
      properties:
        id:
          type: integer
          format: int64
          example: 1
        user_id:
          type: integer
          format: int64
          example: 12345
        restaurant_id:
          type: integer
          format: int64
          example: 1
        status:
          $ref: "#/components/schemas/OrderStatus"
        total_price:
          type: integer
          format: int64
          minimum: 0
          description: Итоговая стоимость заказа в копейках.
          example: 115000
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    OrderItem:
      type: object
      required:
        - menu_item_id
        - name
        - unit_price
        - quantity
      description: |
        Snapshot позиции меню на момент создания заказа.
        Изменение имени или цены в меню не изменяет уже созданный заказ.
      properties:
        menu_item_id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: Burger
        unit_price:
          type: integer
          format: int64
          description: Цена одной позиции в копейках на момент заказа.
          example: 50000
        quantity:
          type: integer
          minimum: 1
          example: 2

    APIError:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              example: MENU_ITEM_UNAVAILABLE
            message:
              type: string
              example: menu item is unavailable

  responses:
    BadRequest:
      description: Некорректный запрос
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIError"

    NotFound:
      description: Ресурс не найден
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIError"

    Conflict:
      description: Конфликт с текущим состоянием ресурса
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIError"

    InternalError:
      description: Внутренняя ошибка
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIError"